slam_toolbox:
  ros__parameters:
    odom_frame:        odom
    base_frame:        base_link
    map_frame:         map
    scan_topic:        /scan
    mode:              mapping
    use_sim_time:      false
    resolution:        0.05
    max_laser_range:   10.0
    minimum_travel_distance: 0.1
    minimum_travel_heading:  0.1
    map_update_interval:     1.0